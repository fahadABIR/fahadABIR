  <script src="gallery.js"></script>
  <script>
    const header = document.getElementById('siteHeader');
    let lastY = window.scrollY, ticking = false;
    function onScroll(){
      const y = window.scrollY, d = y - lastY;
      if (d > 8 && y > 80){ header.classList.add('is-hidden'); closeMenu(); }
      else if (d < -8){ header.classList.remove('is-hidden'); }
      lastY = y; ticking = false;
    }
    window.addEventListener('scroll', () => { if(!ticking){ requestAnimationFrame(onScroll); ticking = true; } }, { passive:true });
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    const isPhone = () => window.matchMedia('(max-width: 700px)').matches;
    function openMenu(){ mobileMenu.classList.add('open'); hamburger.setAttribute('aria-expanded','true'); hamburger.setAttribute('aria-label','Close menu'); }
    function closeMenu(){ if(!mobileMenu) return; mobileMenu.classList.remove('open'); hamburger.setAttribute('aria-expanded','false'); hamburger.setAttribute('aria-label','Open menu'); }
    function toggleMenu(){ mobileMenu.classList.contains('open') ? closeMenu() : openMenu(); }
    hamburger?.addEventListener('click', (e) => { e.preventDefault(); toggleMenu(); });
    mobileMenu?.querySelectorAll('a').forEach(a => a.addEventListener('click', () => closeMenu()));
    document.addEventListener('click', (e) => {
      if(!isPhone() || !mobileMenu.classList.contains('open')) return;
      if(!(mobileMenu.contains(e.target) || hamburger.contains(e.target))) closeMenu();
    });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeMenu(); });
  </script>
